name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: LumenKit (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite headers
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev
      - name: Build and test
        run: swift test --package-path Packages/LumenKit

  apple:
    name: LumenKit (macOS) + iOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: LumenKit tests on macOS
        run: swift test --package-path Packages/LumenKit
      - name: Build app for iOS Simulator
        if: hashFiles('Lumen.xcodeproj/project.pbxproj') != ''
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project Lumen.xcodeproj \
            -scheme Lumen \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build/xcodebuild.log | grep -E "error:|warning: |BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log
